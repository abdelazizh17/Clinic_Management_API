services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinic-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      # 14330 on the host -> 1433 inside the container.
      # We use 14330 to avoid clashing with a local SQL Server Express.
      - "14330:1433"
    volumes:
      # Named volume: the database files survive "docker compose down".
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Clinic_Management_API/Dockerfile
    container_name: clinic-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      UseHttpsRedirection: "false"
      # The background job uses DateTime.Now, so the container must use Cairo time.
      TZ: Africa/Cairo
      ConnectionStrings__cs: "Server=sqlserver,1433;Database=Clinic_Management_Db;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      ConnectionStrings__HangfireConnection: "Server=sqlserver,1433;Database=Clinic_Management_Db;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      JWT__Key: ${JWT_KEY}
      JWT__Issuer: ClinicManagementApi
      JWT__Audience: ClinicManagementClient
      JWT__DurationInDays: 7
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminUserName: ${SEED_ADMIN_USERNAME}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
